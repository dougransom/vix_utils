[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vix_utils"
# Note: flit usually requires the version to be in the __init__.py if dynamic. 
# If you want uv to manage it simply, you can keep it as is.
version = "0.1.8"
description = "Provide VIX Cash and Futures Term Structure as Pandas dataframes"
authors = [{name = "Doug Ransom", email = "doug@ransom.vip"}]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["vix", "volatility", "pandas", "vix term structure", "cboe"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas",
    "pandas-market-calendars >= 4.4.0",
    "aiofiles",
    "aiohttp[speedups]",
    "openpyxl",
    "appdirs",
    "more_itertools",
    "icecream",
]

[project.optional-dependencies]
test = ["pytest"]
examples = ["matplotlib", "scipy"]

[project.scripts]
vixutil = "vix_utils.vixutil:main"
vix_sample_plots = "vix_utils.examples.sample_plots:main"
vix_sample_load_data = "vix_utils.examples.sample_load_data:main"

[project.urls]
repository = "https://github.com/dougransom/vix_utils"

# --- UV SPECIFIC CONFIGURATION ---
[tool.uv]
# This tells uv to include your optional dependencies in the default environment
[dependency-groups]
dev = [
    "pytest",
    "matplotlib",
    "scipy",
]

# You no longer need the [tool.uv] section unless you are configuring 
# specific uv behaviors like index URLs or constraint files.

[tool.pytest.ini_options]
minversion = "7.1.2"
addopts = "--capture=tee-sys"
pythonpath = ["src"] # Added 'src' if your code follows the src-layout, otherwise leave empty
testpaths = ["test"]
python_files = ["test_*.py"]